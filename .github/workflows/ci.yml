name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - name: Maven is available
        run: mvn -v
      - name: Install pnpm, Yarn and Poetry (for the end-to-end tests)
        run: |
          npm install -g pnpm@10 yarn@1
          npm install --prefix "$RUNNER_TEMP/berry" @yarnpkg/cli-dist@4
          echo "DEPSECT_TEST_BERRY_PATH=$RUNNER_TEMP/berry/node_modules/@yarnpkg/cli-dist/bin/yarn.js" >> "$GITHUB_ENV"
          pipx install poetry
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist is up to date
        run: npm run build && git diff --exit-code dist
