name: depsect
description: git bisect for grouped dependency updates. Finds which bump in a Dependabot/Renovate PR broke the build.
author: LilVi02
branding:
  icon: search
  color: orange

inputs:
  test-command:
    description: Command that must pass, e.g. "npm test" or "npm run build && npm test".
    required: true
  install-command:
    description: Install command. Defaults to the package manager's own (npm install, pnpm install, yarn install, uv sync --frozen, poetry sync, cargo fetch, go mod download).
    required: false
  base:
    description: Ref with the old dependencies. Defaults to the PR base commit.
    required: false
  head:
    description: Ref with the new dependencies.
    required: false
    default: HEAD
  working-directory:
    description: Directory to run in, relative to the repository root. Every project changed below it (including workspace members) is found automatically, and the test command runs here.
    required: false
    default: .
  retries:
    description: Re-run a failing test this many times before trusting it (for flaky suites).
    required: false
    default: '0'
  timeout-minutes:
    description: Per-command timeout in minutes (0 = none).
    required: false
    default: '0'
  transitive:
    description: Bisect transitive (lockfile-only) changes. auto = only when no direct dependency changed (e.g. lock file maintenance); always; never.
    required: false
    default: auto
  open-pr:
    description: When a culprit is found, open (or refresh) a pull request with just the verified-safe updates. Needs contents and pull-requests write permissions.
    required: false
    default: 'false'
  pr-token:
    description: Token used to push the safe-updates branch and open its PR. Pushes made with the default GITHUB_TOKEN do not trigger other workflows, so pass a PAT or GitHub App token if CI should run on that PR.
    required: false
  apply-safe:
    description: Write the verified-safe updates to the working tree, e.g. to open a PR with them.
    required: false
    default: 'false'
  comment:
    description: Post (or update) a report comment on the pull request.
    required: false
    default: 'true'
  fail-on-culprit:
    description: Fail the step when a culprit is found.
    required: false
    default: 'true'
  github-token:
    description: Token used to comment on the PR.
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: One of found, no-failure, base-broken, no-updates.
  culprits:
    description: JSON array of culprit sets, e.g. [["postcss"],["react","react-dom"]].
  safe:
    description: JSON array of updates verified to pass together.
  safe-pr:
    description: URL of the pull request opened with the safe updates (when open-pr is enabled).

runs:
  using: node24
  main: dist/action.js
